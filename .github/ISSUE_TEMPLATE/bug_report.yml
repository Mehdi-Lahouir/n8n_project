name: Bug report
description: Report a reproducible problem with the stack.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include secrets, API keys, credential exports, or private webhook URLs."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local, production, CI, or other.
      placeholder: "local Docker Desktop on Windows"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Exact commands or actions.
      placeholder: |
        1. Run ...
        2. Open ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets before pasting.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Secret check
      options:
        - label: I removed secrets, tokens, passwords, and private URLs from this report.
          required: true
